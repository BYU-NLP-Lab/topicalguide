[pytest]
DJANGO_SETTINGS_MODULE = topicalguide.settings
testpaths = tests

markers =
    selenium: browser tests; need Chrome and start a live server

filterwarnings =
    # Django's threaded live-test server closes the browser's keep-alive
    # connections from worker threads after the per-test database is gone, and
    # SQLite's thread-sharing check then raises during shutdown. Harmless, but
    # it surfaces attributed to whichever test happens to run next.
    ignore::pytest.PytestUnhandledThreadExceptionWarning
